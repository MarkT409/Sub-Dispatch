<html>
  <body>
    <!-- Netlify detects this at deploy time so the contact form can POST -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="message" />
    </form>
  </body>
</html>
